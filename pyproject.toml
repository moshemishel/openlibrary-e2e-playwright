[project]
name = "openlibrary-e2e-playwright"
version = "0.1.0"
description = "End-to-end automation framework for OpenLibrary using Playwright and Pytest"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Moshe Mishel", email = "nav0863@gmail.com" }
]
dependencies = [
    "playwright>=1.40",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pages", "utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear (catches bugs)
    "SIM", # flake8-simplify
]
